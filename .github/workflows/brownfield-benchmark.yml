name: PACT Brownfield Historical Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/brownfield/**"
      - "scripts/benchmark/**"
      - "scripts/pact/context.py"
      - "scripts/pact/discover.py"
      - "scripts/pact/code_map.py"
      - "scripts/pact/task.py"
      - "scripts/pact/eval.py"

jobs:
  historical-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run historical brownfield retrieval replay
        run: |
          python scripts/benchmark/historical_replay.py \
            --output /tmp/pact-brownfield-benchmark.json

      - name: Publish benchmark summary
        env:
          REPORT: /tmp/pact-brownfield-benchmark.json
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          data = json.loads(pathlib.Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
          summary = data["summary"]
          lines = [
              "# PACT Brownfield Historical Retrieval",
              "",
              f"- Cases: {summary['case_count']}",
              f"- Oracle source files: {summary['oracle_file_count']}",
              f"- Direct weighted recall: {summary['direct_weighted_recall']:.3f}",
              f"- Expanded-query weighted recall: {summary['expanded_weighted_recall']:.3f}",
              f"- Cases improved by query expansion: {summary['cases_improved_by_query_expansion']}",
              "",
              "| Case | Direct recall | Expanded recall | Direct context | Expanded context |",
              "|---|---:|---:|---:|---:|",
          ]
          for item in data["results"]:
              lines.append(
                  f"| {item['id']} | {item['direct']['recall']:.3f} | "
                  f"{item['expanded']['recall']:.3f} | "
                  f"{item['direct']['context_code_files']} | "
                  f"{item['expanded']['context_code_files']} |"
              )
          lines.extend(["", summary["interpretation"]])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
