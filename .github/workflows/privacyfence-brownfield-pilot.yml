name: PACT PrivacyFence Pinned Second Brownfield Pilot

on:
  pull_request:
    paths:
      - ".github/workflows/privacyfence-brownfield-pilot.yml"
      - "scripts/benchmark/privacyfence_pilot.py"
      - "scripts/benchmark/privacyfence_nonfunctional_probe.py"
      - "scripts/benchmark/brownfield_adr_viewer.py"
      - "scripts/benchmark/decision_memory_m0.py"
      - "scripts/pact/**"
      - ".pact/schema/**"
      - "scripts/pact/tests/test_privacyfence_pilot.py"
      - "benchmarks/privacyfence/**"
      - "docs/evaluation/privacyfence-pilot-*.md"
      - "bootstrap.py"
      - "pact.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-privacyfence-pact-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: PACT exact SHA, read-only token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact test checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Freeze integrity and isolated unit cases
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/pact/tests -p "test_privacyfence_pilot.py"
          python scripts/pact/pact.py schema-lint
          python scripts/pact/pact.py check

      - name: Clone only public pinned PrivacyFence source into disposable runner
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/pact-privacyfence-source"
          echo "PRIVACYFENCE_SOURCE=$TARGET" >> "$GITHUB_ENV"
          git clone --quiet https://github.com/privacyfence/privacyfence.git "$TARGET"
          git -C "$TARGET" checkout --detach --quiet \
            6a03856a6e1819b2eacd3963154ebc7d02923296
          test "$(git -C "$TARGET" rev-parse HEAD)" = \
            "6a03856a6e1819b2eacd3963154ebc7d02923296"
          test -z "$(git -C "$TARGET" status --porcelain --untracked-files=no)"

      - name: Execute installed PACT A/B and preserve complete success/failure report
        shell: bash
        run: |
          set -euo pipefail
          exit_code=0
          python scripts/benchmark/privacyfence_pilot.py \
            --target "$PRIVACYFENCE_SOURCE" \
            > "$RUNNER_TEMP/pact-privacyfence-pilot.json" || exit_code=$?
          cat "$RUNNER_TEMP/pact-privacyfence-pilot.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "pact-privacyfence-pilot.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["real_agent_executed"] is False
          assert data["independent_holdout"] is False
          assert data["owner_approval_authenticated"] is False
          assert data["release_gate"] == "HOLD"
          print("Source", data["source_repo"], data["source_sha"])
          print("Engineering gate:", data["engineering_gate"])
          print("Failure reasons:", data.get("integrity_failures"))
          print("Developer-only retrieval metrics:", data.get("developer_scoring"))
          PY
          test "$exit_code" -eq 0

      - name: Paired real-source routine-task opt-in probe (no model)
        shell: bash
        run: |
          set -euo pipefail
          exit_code=0
          python scripts/benchmark/privacyfence_nonfunctional_probe.py \
            --target "$PRIVACYFENCE_SOURCE" \
            --baseline "$RUNNER_TEMP/pact-privacyfence-pilot.json" \
            > "$RUNNER_TEMP/pact-privacyfence-nonfunctional-routine.json" || exit_code=$?
          cat "$RUNNER_TEMP/pact-privacyfence-nonfunctional-routine.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((
              Path(os.environ["RUNNER_TEMP"]) /
              "pact-privacyfence-nonfunctional-routine.json"
          ).read_text(encoding="utf-8"))
          assert data["real_agent_executed"] is False
          assert data["independent_holdout"] is False
          assert data["authenticated_owner_observation"] is False
          assert data["provider_billed_tokens"] is None
          assert data["release_gate"] == "HOLD"
          print("Engineering gate:", data["engineering_gate"])
          print("Developer-labelled opt-in routine pairs:",
                data.get("paired_developer_observation"))
          print("Failures:", data["failures"])
          PY
          test "$exit_code" -eq 0

      - name: Preserve developer-only source retrieval receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pinned-privacyfence-developer-retrieval-json
          path: |
            ${{ runner.temp }}/pact-privacyfence-pilot.json
            ${{ runner.temp }}/pact-privacyfence-nonfunctional-routine.json
          if-no-files-found: warn
          retention-days: 14

  original-offline-policy-tests:
    # Untrusted upstream code executes in its own fresh VM, no PACT checkout,
    # case oracle, evaluator or shared process. No live connector secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Set up Python for isolated original-source unit tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Clone pinned public upstream in test-only VM
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/privacyfence-upstream-tests"
          echo "PRIVACYFENCE_TEST_TARGET=$TARGET" >> "$GITHUB_ENV"
          git clone --quiet https://github.com/privacyfence/privacyfence.git "$TARGET"
          git -C "$TARGET" checkout --detach --quiet \
            6a03856a6e1819b2eacd3963154ebc7d02923296
          test "$(git -C "$TARGET" rev-parse HEAD)" = \
            "6a03856a6e1819b2eacd3963154ebc7d02923296"

      - name: Install only original project declared test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -e "$PRIVACYFENCE_TEST_TARGET[test]"

      - name: Run narrow real repository unit tests, never live connectors
        shell: bash
        run: |
          set -euo pipefail
          cd "$PRIVACYFENCE_TEST_TARGET"
          python -m pytest -q \
            tests/unit/policy/test_engine.py \
            tests/unit/policy/test_conditions.py \
            tests/unit/test_export_files.py \
            tests/unit/test_code_no_history.py \
            tests/unit/test_docs_no_history.py \
            2>&1 | tee "$RUNNER_TEMP/privacyfence-upstream-unit.txt"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Source-bound ADR 0056 guard — deliberate RED in a disposable clone
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PRIVACYFENCE_TEST_TARGET"
          PIN="6a03856a6e1819b2eacd3963154ebc7d02923296"
          # Assert actual upstream decision and executable guard, not a copied
          # PACT-authored oracle. Both blobs were recorded before this workflow.
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$PIN"
          test "$(git -C "$SOURCE" hash-object docs/adr/0056-code-carries-no-project-history.md)" = \
            "ba2e6a39df04e373ded03ce2f73d2b1313b6657d"
          test "$(git -C "$SOURCE" hash-object tests/unit/test_code_no_history.py)" = \
            "ce1102d9a2cab88c149e0b42bb700f3affbdc5c0"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"

          # Negative-control mutation is confined to another disposable copy.
          # The original pinned checkout stays byte-for-byte unchanged.
          PROBE="$RUNNER_TEMP/privacyfence-adr0056-negative"
          git clone --quiet --local --no-hardlinks "$SOURCE" "$PROBE"
          git -C "$PROBE" checkout --quiet --detach "$PIN"
          test -f "$PROBE/src/privacyfence/__init__.py"
          printf '\n# Stale project history from Phase 42 of an obsolete plan.\n' \
            >> "$PROBE/src/privacyfence/__init__.py"
          exit_code=0
          (
            cd "$PROBE"
            python -m pytest -q tests/unit/test_code_no_history.py \
              -k test_code_carries_no_history \
              > "$RUNNER_TEMP/privacyfence-adr0056-expected-red.txt" 2>&1
          ) || exit_code=$?
          if [ "$exit_code" -ne 1 ]; then
            echo "Expected precise ADR violation test failure (exit 1), got $exit_code"
            exit 1
          fi
          grep -F 'src/privacyfence/__init__.py' \
            "$RUNNER_TEMP/privacyfence-adr0056-expected-red.txt" > /dev/null
          grep -F 'Phase 42' \
            "$RUNNER_TEMP/privacyfence-adr0056-expected-red.txt" > /dev/null
          grep -F 'phase name' \
            "$RUNNER_TEMP/privacyfence-adr0056-expected-red.txt" > /dev/null
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=no)"
          echo "Source-backed ADR guard: original GREEN, disposable violation RED."
          echo "No coding Agent was invoked; semantic and Owner gates remain HOLD."

      - name: Save upstream test-only receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pinned-privacyfence-original-unit-tests
          path: |
            ${{ runner.temp }}/privacyfence-upstream-unit.txt
            ${{ runner.temp }}/privacyfence-adr0056-expected-red.txt
          if-no-files-found: warn
          retention-days: 14
