name: PACT Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  portability:
    name: portability (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Runtime entry points
        run: |
          python pact.py --help
          python bootstrap.py --help
          python scripts/pact/pact.py schema-lint
          python scripts/pact/pact.py check

      - name: Cross-platform portability tests
        run: |
          python -m unittest discover -s scripts/pact/tests -p "test_bootstrap.py"
          python -m unittest discover -s scripts/pact/tests -p "test_compact_runtime.py"
          python -m unittest discover -s scripts/pact/tests -p "test_distribution_upgrade.py"
          python -m unittest discover -s scripts/pact/tests -p "test_stdlib_runtime.py"
          python -m unittest discover -s scripts/pact/tests -p "test_init_readiness.py"
          python -m unittest discover -s scripts/pact/tests -p "test_task_change_coverage.py"
          python -m unittest discover -s scripts/pact/tests -p "test_streaming_reliability.py"

  release:
    needs:
      - portability
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify tag matches runtime version and classify release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          RUNTIME_VERSION="$(tr -d '[:space:]' < .pact/VERSION)"
          echo "tag=$TAG_VERSION runtime=$RUNTIME_VERSION"
          test "$TAG_VERSION" = "$RUNTIME_VERSION"

          python - "$TAG_VERSION" >> "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          if not re.fullmatch(
              r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?",
              version,
          ):
              raise SystemExit(f"unsupported release version: {version}")
          print(f"prerelease={'true' if '-' in version else 'false'}")
          PY

      - name: Validate release source
        run: |
          python scripts/pact/pact.py schema-lint
          python scripts/pact/pact.py check
          python -m unittest discover -s scripts/pact/tests -p "test_*.py"
          python bootstrap.py --help

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp bootstrap.py dist/pact-bootstrap.py
          python scripts/pact/runtime_bundle.py --output dist/pact.pyz
          (
            cd dist
            sha256sum pact-bootstrap.py pact.pyz > SHA256SUMS
          )
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            dist/pact-bootstrap.py \
            dist/pact.pyz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "PACT $GITHUB_REF_NAME" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
