name: PACT Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  portability:
    name: portability (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Runtime entry points
        shell: bash
        run: |
          set -euo pipefail
          python pact.py --help
          python bootstrap.py --help
          python scripts/pact/pact.py schema-lint
          python scripts/pact/pact.py check

      - name: Cross-platform portability tests
        shell: bash
        run: |
          set -euo pipefail
          # Auto-discover every current and future test, including trusted
          # Evidence / Task Finish, on all three OS and Python versions.
          python -m unittest discover -s scripts/pact/tests -p 'test_*.py'

  release:
    needs:
      - portability
    runs-on: ubuntu-latest
    # Configure required reviewers for this protected Environment in GitHub
    # Settings. An unconfigured environment cannot bypass the explicit
    # fail-closed GO and exact-commit evidence gates below.
    environment: pact-release-approval
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail closed until independently authorized Owner/Agent release gates
        env:
          PACT_RELEASE_GO: ${{ vars.PACT_RELEASE_GO }}
          PACT_RELEASE_APPROVED_SHA: ${{ vars.PACT_RELEASE_APPROVED_SHA }}
          PACT_AGENT_OWNER_GATES_APPROVED: ${{ vars.PACT_AGENT_OWNER_GATES_APPROVED }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$TAG_SHA" = "$MAIN_SHA" || {
            echo "Release HOLD: tag must identify the currently reviewed main HEAD"
            exit 1
          }
          test "${PACT_RELEASE_GO:-}" = "GO" || {
            echo "Release HOLD: missing explicit protected-environment GO"
            exit 1
          }
          test "${PACT_AGENT_OWNER_GATES_APPROVED:-}" = "true" || {
            echo "Release HOLD: real Agent/Owner acceptance is not approved"
            exit 1
          }
          test "${PACT_RELEASE_APPROVED_SHA:-}" = "$TAG_SHA" || {
            echo "Release HOLD: explicit approval must bind the exact tag commit"
            exit 1
          }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag matches runtime version and classify release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          RUNTIME_VERSION="$(tr -d '[:space:]' < .pact/VERSION)"
          echo "tag=$TAG_VERSION runtime=$RUNTIME_VERSION"
          test "$TAG_VERSION" = "$RUNTIME_VERSION"

          python - "$TAG_VERSION" >> "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          if not re.fullmatch(
              r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?",
              version,
          ):
              raise SystemExit(f"unsupported release version: {version}")
          print(f"prerelease={'true' if '-' in version else 'false'}")
          PY

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pact/pact.py schema-lint
          python scripts/pact/pact.py check
          python -m unittest discover -s scripts/pact/tests -p "test_*.py"
          python bootstrap.py --help

      - name: Build and smoke-test release assets
        run: python scripts/release/release_assets.py --output-dir dist --smoke

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            dist/pact-bootstrap.py \
            dist/pact.pyz \
            dist/LICENSE \
            dist/SHA256SUMS \
            --verify-tag \
            --title "PACT $GITHUB_REF_NAME" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
