name: PACT Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify tag matches runtime version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          RUNTIME_VERSION="$(tr -d '[:space:]' < .pact/VERSION)"
          echo "tag=$TAG_VERSION runtime=$RUNTIME_VERSION"
          test "$TAG_VERSION" = "$RUNTIME_VERSION"

      - name: Validate release source
        run: |
          python scripts/pact/pact.py schema-lint
          python scripts/pact/pact.py check
          python -m unittest discover -s scripts/pact/tests -p "test_*.py"
          python bootstrap.py --help

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp bootstrap.py dist/pact-bootstrap.py
          python scripts/pact/runtime_bundle.py --output dist/pact.pyz
          (
            cd dist
            sha256sum pact-bootstrap.py pact.pyz > SHA256SUMS
          )
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME"             dist/pact-bootstrap.py             dist/pact.pyz             dist/SHA256SUMS             --verify-tag             --title "PACT $GITHUB_REF_NAME"             --generate-notes
