name: PACT Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  classify:
    name: Validate exact release tag and channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate tag version, exact main SHA and channel
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          python scripts/release/release_policy.py classify \
            --tag "$GITHUB_REF_NAME" \
            --version-file .pact/VERSION \
            --github-output "$GITHUB_OUTPUT"
          TAG_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$TAG_SHA" = "$MAIN_SHA" || {
            echo "Release HOLD: tag is not the current reviewed main commit"
            exit 1
          }

  portability:
    needs: classify
    name: portability (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Runtime entry points
        shell: bash
        run: |
          set -euo pipefail
          python pact.py --help
          python bootstrap.py --help
          python scripts/pact/pact.py schema-lint
          python scripts/pact/pact.py check

      - name: Cross-platform portability tests
        shell: bash
        run: |
          set -euo pipefail
          # Auto-discover every current and future test, including trusted
          # Evidence / Task Finish, on all three OS and Python versions.
          python -m unittest discover -s scripts/pact/tests -p 'test_*.py'

  stable_approval:
    name: Stable-only human approval and Owner acceptance
    needs:
      - classify
      - portability
    if: ${{ needs.classify.outputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    # Stable release retains the actual protected GitHub reviewer event.
    environment: pact-release-approval
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fail closed without genuine human review, Owner GO, real Agent/Owner acceptance and exact CI
        env:
          GH_TOKEN: ${{ github.token }}
          PACT_RELEASE_GO: ${{ vars.PACT_RELEASE_GO }}
          PACT_RELEASE_APPROVED_SHA: ${{ vars.PACT_RELEASE_APPROVED_SHA }}
          PACT_AGENT_OWNER_GATES_APPROVED: ${{ vars.PACT_AGENT_OWNER_GATES_APPROVED }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          TAG_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          # Environment approval is audited from this exact GitHub Actions
          # run, after the protected stable approval job becomes executable.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            > "$RUNNER_TEMP/pact-release-approvals.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pact-check.yml/runs?head_sha=$TAG_SHA&per_page=100" \
            > "$RUNNER_TEMP/pact-release-check-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/core-matrix.yml/runs?head_sha=$TAG_SHA&per_page=100" \
            > "$RUNNER_TEMP/pact-release-matrix-runs.json"
          python scripts/release/release_policy.py gate \
            --tag "$GITHUB_REF_NAME" --version-file .pact/VERSION \
            --tag-sha "$TAG_SHA" --main-sha "$MAIN_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --approvals-file "$RUNNER_TEMP/pact-release-approvals.json" \
            --check-runs-file "$RUNNER_TEMP/pact-release-check-runs.json" \
            --matrix-runs-file "$RUNNER_TEMP/pact-release-matrix-runs.json"

  release:
    name: Publish approved stable or CI-verified RC
    needs:
      - classify
      - portability
      - stable_approval
    # A skipped stable approval is expected ONLY for RC. Stable MUST
    # have an actual successful protected approval job before publication.
    if: >-
      ${{ !cancelled() &&
          needs.classify.result == 'success' &&
          needs.portability.result == 'success' &&
          ((needs.classify.outputs.channel == 'rc' && needs.stable_approval.result == 'skipped') ||
           (needs.classify.outputs.channel == 'stable' && needs.stable_approval.result == 'success')) }}
    runs-on: ubuntu-latest
    # No Environment needed for RC; stable approval occurs in stable_approval.
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: RC tag and exact-main CI gate, no Environment or GO
        if: ${{ needs.classify.outputs.channel == 'rc' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          TAG_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pact-check.yml/runs?head_sha=$TAG_SHA&per_page=100" \
            > "$RUNNER_TEMP/pact-release-check-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/core-matrix.yml/runs?head_sha=$TAG_SHA&per_page=100" \
            > "$RUNNER_TEMP/pact-release-matrix-runs.json"
          python scripts/release/release_policy.py gate \
            --tag "$GITHUB_REF_NAME" --version-file .pact/VERSION \
            --tag-sha "$TAG_SHA" --main-sha "$MAIN_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --check-runs-file "$RUNNER_TEMP/pact-release-check-runs.json" \
            --matrix-runs-file "$RUNNER_TEMP/pact-release-matrix-runs.json"

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pact/pact.py schema-lint
          python scripts/pact/pact.py check
          python -m unittest discover -s scripts/pact/tests -p "test_*.py"
          python bootstrap.py --help

      - name: Build and smoke-test release assets
        run: python scripts/release/release_assets.py --output-dir dist --smoke

      - name: Publish approved RC or stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.classify.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$TAG_SHA" = "$MAIN_SHA" || {
            echo "Release HOLD: main HEAD changed after approval/build"
            exit 1
          }
          EXTRA_ARGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease --latest=false)
            EXTRA_ARGS+=(--notes "EXPERIMENTAL RC FOR REAL-PROJECT PILOTS ONLY. No independently verified coding-Agent obedience, Owner benefit, or stable-release approval is claimed. Treat historical YAML/Decision migration as opt-in and review all reported conflicts; see docs/releasing.md and Issue #63.")
          fi

          gh release create "$GITHUB_REF_NAME" \
            dist/pact-bootstrap.py \
            dist/pact.pyz \
            dist/LICENSE \
            dist/SHA256SUMS \
            --verify-tag \
            --title "PACT $GITHUB_REF_NAME" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
