name: PACT Pinned Historical Install Upgrade (0.1 0.2 0.3 0.4)

on:
  pull_request:
    paths:
      - ".github/workflows/historical-upgrade-compat.yml"
      - "scripts/pact/legacy_upgrade.py"
      - "scripts/pact/upgrade.py"
      - "scripts/pact/tests/test_legacy_upgrade_compat.py"
      - "scripts/pact/distribution.py"
      - "bootstrap.py"
      - "docs/evaluation/historical-upgrade-compatibility-*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-history-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - expected: "0.1.0"
            commit: 101ccb91e1b312b3e061c012b1c167003260c749
          - expected: "0.2.0"
            commit: 8ef8228340cd22e668e898128b33bafde5b047d7
          - expected: "0.3.0"
            commit: f8690a64f7d6bc448092919cfb71411567041fc5
          - expected: "0.4.0-rc.1"
            commit: ecb27333ac3ebdcd1fa638ef269914456db70051
    permissions:
      contents: read
    steps:
      - name: Checkout evaluated PACT source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert head identity
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare disposable pinned historical PACT checkout
        shell: bash
        env:
          PIN: ${{ matrix.commit }}
          VERSION: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          ORIGIN="$RUNNER_TEMP/pact-historical-original"
          TARGET="$RUNNER_TEMP/pact-historical-adopted"
          echo "OLD_PACT_SOURCE=$ORIGIN" >> "$GITHUB_ENV"
          echo "OLD_PACT_TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "HISTORICAL_PIN=$PIN" >> "$GITHUB_ENV"
          git clone --quiet https://github.com/ningcol/PACT.git "$ORIGIN"
          git -C "$ORIGIN" checkout --detach --quiet "$PIN"
          test "$(git -C "$ORIGIN" rev-parse HEAD)" = "$PIN"
          test "$(tr -d '[:space:]' < "$ORIGIN/.pact/VERSION")" = "$VERSION"
          test -z "$(git -C "$ORIGIN" status --porcelain --untracked-files=no)"
          python "$ORIGIN/scripts/pact/init.py" --target "$TARGET" --apply
          test -f "$TARGET/.pact/install.json"
          test "$(tr -d '[:space:]' < "$TARGET/.pact/VERSION")" = "$VERSION"

      - name: Set documented Owner preference and historical Decision source
        shell: bash
        env:
          VERSION: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import hashlib
          from pathlib import Path

          target = Path(os.environ["OLD_PACT_TARGET"])
          legacy = os.environ["VERSION"] in {"0.1.0", "0.2.0"}
          config = target / ".pact" / ("config.yaml" if legacy else "config.toml")
          contents = config.read_text(encoding="utf-8")
          before = "language: auto" if legacy else 'language = "auto"'
          after = "language: zh-CN" if legacy else 'language = "zh-CN"'
          assert contents.count(before) == 1, (config, contents[:400])
          config.write_text(contents.replace(before, after), encoding="utf-8")
          baseline = target / ".pact" / ("baseline.yaml" if legacy else "baseline.toml")
          base = baseline.read_text(encoding="utf-8")
          old = "vocabulary: pending" if legacy else 'vocabulary = "pending"'
          new = "vocabulary: reviewed" if legacy else 'vocabulary = "reviewed"'
          assert base.count(old) == 1
          baseline.write_text(base.replace(old, new), encoding="utf-8")
          doc = target / ".agents/decisions/implemented/historical-owner-approval.md"
          doc.parent.mkdir(parents=True, exist_ok=True)
          # 0.1–0.3 used YAML Decision metadata; an existing 0.4 Decision
          # already has TOML metadata and must never be rewritten.
          modern = os.environ["VERSION"].startswith("0.4.")
          header = (
              '+++\n[pact]\ntype = "decision"\nid = "DEC-PF-UPGRADE-001"\n'
              'status = "implemented"\naliases = ["owner approval boundary"]\n+++\n\n'
              if modern else
              "---\npact:\n  type: decision\n  id: DEC-PF-UPGRADE-001\n"
              "  status: implemented\n  aliases:\n    - owner approval boundary\n---\n\n"
          )
          original_body = (
              "# Original Owner decision must survive\n\n"
              "Do not silently change authorization without Owner approval.\n"
          )
          doc.write_text(header + original_body, encoding="utf-8")
          tracked = {
              name: hashlib.sha256(path.read_bytes()).hexdigest()
              for name, path in {
                  "config": config, "baseline": baseline, "decision": doc,
              }.items()
          }
          proof = {
              "historical_version": os.environ["VERSION"],
              "historical_commit": os.environ["HISTORICAL_PIN"],
              "old_sha256": tracked,
              "original_decision_body": doc.read_text().split("+++\n" if modern else "---\n", 2)[2],
              "original_decision_full_sha256": hashlib.sha256(doc.read_bytes()).hexdigest(),
              "legacy_source": legacy,
          }
          (Path(os.environ["RUNNER_TEMP"]) / "old-upgrade-before.json").write_text(
              json.dumps(proof, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Baseline dry-run must refuse historical YAML but allow native 0.4
        env:
          VERSION: ${{ matrix.expected }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pact/upgrade.py \
            --target "$OLD_PACT_TARGET" --source "$GITHUB_WORKSPACE" \
            --json > "$RUNNER_TEMP/legacy-blocked.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads((Path(os.environ["RUNNER_TEMP"]) / "legacy-blocked.json").read_text())
          if os.environ["VERSION"].startswith("0.4."):
              assert not d["conflicts"], d["conflicts"]
          else:
              assert d["conflicts"], "Legacy Decision must block a silent upgrade"
              assert any("migrate-legacy" in c["reason"] for c in d["conflicts"])
          assert d["mode"] == "dry-run" and not d["applied"]
          PY

      - name: Migration preview, injected failure rollback, and successful retry
        env:
          VERSION: ${{ matrix.expected }}
        shell: bash
        run: |
          set -euo pipefail
          UPGRADE_ARGS=(--target "$OLD_PACT_TARGET" --source "$GITHUB_WORKSPACE")
          if [[ "$VERSION" != 0.4.* ]]; then
            UPGRADE_ARGS+=(--migrate-legacy)
          fi
          python scripts/pact/upgrade.py "${UPGRADE_ARGS[@]}" \
            --json > "$RUNNER_TEMP/legacy-plan.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["OLD_PACT_TARGET"])
          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "legacy-plan.json").read_text())
          assert not plan["conflicts"], plan["conflicts"]
          migrated = [x for x in plan["operations"]
                      if x["action"] == "migrate-legacy-metadata"]
          if os.environ["VERSION"].startswith("0.4."):
              assert not migrated, migrated
          else:
              assert migrated, plan
          assert any(x["action"] in {
              "create-framework", "update-framework", "remove-framework",
              "migrate-legacy-seed", "migrate-legacy-metadata"
          } for x in plan["operations"]), plan
          fingerprint = {
              p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }
          (Path(os.environ["RUNNER_TEMP"]) / "legacy-before-fault.json").write_text(
              json.dumps(fingerprint, indent=2) + "\n", encoding="utf-8"
          )
          PY
          set +e
          PACT_TEST_FAIL_AFTER_REPLACE=1 python scripts/pact/upgrade.py \
            "${UPGRADE_ARGS[@]}" --apply --json \
            > "$RUNNER_TEMP/legacy-injected-failure.json"
          fault_rc=$?
          set -e
          test "$fault_rc" -eq 2
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["OLD_PACT_TARGET"])
          scratch = Path(os.environ["RUNNER_TEMP"])
          data = json.loads((scratch / "legacy-injected-failure.json").read_text())
          assert not data["applied"] and data["rolled_back"], data
          before = json.loads((scratch / "legacy-before-fault.json").read_text())
          after = {
              p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob("*") if p.is_file()
          }
          assert before == after, {
              "missing_or_extra": sorted(set(before) ^ set(after)),
              "altered": sorted(k for k in set(before) & set(after)
                                if before[k] != after[k]),
          }
          print("Injected upgrade fault: all prior files and hashes restored")
          PY
          python scripts/pact/upgrade.py "${UPGRADE_ARGS[@]}" \
            --apply --json > "$RUNNER_TEMP/legacy-applied.json"

      - name: Verify migration, historical authority, manifest and fresh PACT runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, tomllib
          from pathlib import Path
          root = Path(os.environ["OLD_PACT_TARGET"])
          scratch = Path(os.environ["RUNNER_TEMP"])
          previous = json.loads((scratch / "old-upgrade-before.json").read_text())
          applied = json.loads((scratch / "legacy-applied.json").read_text())
          assert applied["applied"] and not applied["rolled_back"], applied
          new_version = (Path(os.environ["GITHUB_WORKSPACE"]) / ".pact/VERSION").read_text().strip()
          manifest = json.loads((root / ".pact/install.json").read_text())
          assert manifest["runtime_version"] == new_version
          assert (root / ".pact/VERSION").read_text().strip() == new_version
          config = tomllib.loads((root / ".pact/config.toml").read_text())
          baseline = tomllib.loads((root / ".pact/baseline.toml").read_text())
          assert config["owner"]["language"] == "zh-CN"
          assert baseline["reviews"]["vocabulary"] == "reviewed"
          if previous["legacy_source"]:
              assert baseline["reviews"]["agent_bootstrap"] == "pending"
              for name in ("config", "baseline"):
                  old = root / (".pact/" + name + ".yaml")
                  assert hashlib.sha256(old.read_bytes()).hexdigest() == previous["old_sha256"][name]
          doc = root / ".agents/decisions/implemented/historical-owner-approval.md"
          raw = doc.read_text()
          assert raw.startswith("+++\n[pact]\n")
          assert raw.split("+++\n", 2)[2] == previous["original_decision_body"]
          assert "DEC-PF-UPGRADE-001" in raw
          if previous["historical_version"].startswith("0.4."):
              assert hashlib.sha256(doc.read_bytes()).hexdigest() == (
                  previous["original_decision_full_sha256"]
              ), "modern 0.4 Decision was unexpectedly rewritten"
          for name in ("config", "baseline"):
              assert manifest["files"][".pact/" + name + ".toml"]["management"] == "seed"
          assert ".agents/decisions/implemented/historical-owner-approval.md" not in manifest["files"]
          print(json.dumps({
              "historical": previous["historical_version"],
              "new_version": new_version,
              "decision_bytes_preserved": True,
              "owner_config_preserved": True,
              "review_status_preserved": True,
              "pre_release_no_agent": True,
          }, indent=2))
          PY
          python "$OLD_PACT_TARGET/pact.py" doctor --strict --json \
            > "$RUNNER_TEMP/legacy-doctor.json"
          python "$OLD_PACT_TARGET/pact.py" owner --strict --json \
            > "$RUNNER_TEMP/legacy-owner.json"
          python "$OLD_PACT_TARGET/pact.py" discover DEC-PF-UPGRADE-001 --json \
            > "$RUNNER_TEMP/legacy-discover.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"])
          d = json.loads((scratch / "legacy-discover.json").read_text())
          assert any(x.get("id") == "DEC-PF-UPGRADE-001"
                     and x.get("artifact_type") == "decision"
                     for x in d["results"]), d["results"][:3]
          print("Original Decision remains typed and retrievable, not just a Markdown file")
          PY

      - name: Repeat upgraded runtime and refuse local framework conflicts
        env:
          VERSION: ${{ matrix.expected }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import sys
          root = pathlib.Path(os.environ["OLD_PACT_TARGET"])
          scratch = pathlib.Path(os.environ["RUNNER_TEMP"])
          upgrader = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "scripts/pact/upgrade.py"
          config = root / ".pact/config.toml"
          config.write_bytes(config.read_bytes() + b"\n# retained local Owner extension\n")
          protected = [
              config, root / ".pact/baseline.toml",
              root / ".agents/decisions/implemented/historical-owner-approval.md",
              root / "AGENTS.md",
          ]
          protected.extend(sorted((root / ".pact").glob("*.yaml")))
          original_sha = {
              p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in protected
          }
          def run(*args, target=root):
              return subprocess.run(
                  [sys.executable, str(upgrader), "--target", str(target),
                   "--source", os.environ["GITHUB_WORKSPACE"], "--json", *args],
                  capture_output=True, text=True, timeout=200,
              )
          preview = run()
          assert preview.returncode == 0, preview.stdout + preview.stderr
          assert not json.loads(preview.stdout)["conflicts"], preview.stdout
          retry = run("--apply")
          assert retry.returncode == 0, retry.stdout + retry.stderr
          assert json.loads(retry.stdout)["applied"]
          assert {
              p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in protected
          } == original_sha, "repeat upgrade overwrote Owner/Decision/guide bytes"

          # Locally modified framework runtime must block entire automatic
          # upgrade; mutate only a disposable GitHub Actions test copy.
          hostile = scratch / "pact-conflict-copy"
          shutil.copytree(root, hostile)
          runtime = hostile / ".pact/pact.pyz"
          runtime.write_bytes(runtime.read_bytes() + b"\n# LOCAL-DIVERGENCE\n")
          manifest = hostile / ".pact/install.json"
          original_manifest = manifest.read_bytes()
          refused = run("--apply", target=hostile)
          assert refused.returncode == 1, refused.stdout + refused.stderr
          detail = json.loads(refused.stdout)
          assert not detail["applied"] and detail["conflicts"], detail
          assert manifest.read_bytes() == original_manifest
          assert runtime.read_bytes().endswith(b"# LOCAL-DIVERGENCE\n")
          assert all(
              (hostile / rel).read_bytes() == (root / rel).read_bytes()
              for rel in original_sha
          ), "conflict affected Owner/Decision/Agent content"
          result = {
              "historical_version": os.environ["VERSION"],
              "historical_pin": os.environ["HISTORICAL_PIN"],
              "post_crash_retry_succeeded": True,
              "repeated_upgrade_preserves_owner_decision_and_agent_bytes": True,
              "local_framework_conflict_fails_closed": True,
              "real_agent_or_owner_trial": False,
          }
          (scratch / "upgrade-acceptance.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Preserve full historical upgrade receipts including failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pact-historical-upgrade-${{ matrix.expected }}
          path: |
            ${{ runner.temp }}/old-upgrade-before.json
            ${{ runner.temp }}/legacy-blocked.json
            ${{ runner.temp }}/legacy-plan.json
            ${{ runner.temp }}/legacy-before-fault.json
            ${{ runner.temp }}/legacy-injected-failure.json
            ${{ runner.temp }}/legacy-applied.json
            ${{ runner.temp }}/upgrade-acceptance.json
            ${{ runner.temp }}/legacy-doctor.json
            ${{ runner.temp }}/legacy-owner.json
            ${{ runner.temp }}/legacy-discover.json
          if-no-files-found: warn
          retention-days: 14
