name: PACT Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PACT checker dependencies
        run: python -m pip install -r scripts/pact/requirements.txt

      - name: Run deterministic PACT checks
        run: python scripts/pact/check.py

      - name: Build derived project map
        run: python scripts/pact/map.py --output /tmp/pact-project-map.json

      - name: Smoke-test Project Discovery
        run: python scripts/pact/discover.py "product truth" --index /tmp/pact-project-map.json --json

      - name: Validate convergence report contract
        run: python scripts/pact/converge.py .pact/examples/convergence-report.example.json

      - name: Validate evidence receipt contract
        run: python scripts/pact/evidence.py .pact/examples/evidence-receipt.example.json

      - name: Validate evidence-backed owner report
        run: |
          python scripts/pact/report.py .pact/examples/owner-report.example.json \
            --evidence .pact/examples/evidence-receipt.example.json \
            --convergence .pact/examples/convergence-report.example.json
