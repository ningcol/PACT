name: PACT Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Assert zero third-party runtime dependencies
        run: |
          test ! -e scripts/pact/requirements.txt
          if grep -R -n -E '^(from|import) (yaml|jsonschema)([ .]|$)' scripts/pact --include='*.py'; then
            echo "PACT core must remain stdlib-only"
            exit 1
          fi

      - name: Validate single-file bootstrap entry point
        run: python bootstrap.py --help

      - name: PACT doctor
        run: python scripts/pact/pact.py doctor

      - name: PACT audit
        run: python scripts/pact/pact.py audit

      - name: Validate framework fitness template
        run: python scripts/pact/pact.py fitness --config .pact/fitness.example.toml --validate-only --json

      - name: Validate Owner Profile fallback
        run: python scripts/pact/pact.py owner --json

      - name: Validate core high-risk policy
        run: python scripts/pact/pact.py risk high --json

      - name: Validate schema/runtime contract
        run: python scripts/pact/pact.py schema-lint

      - name: Validate immutable workflow action pins
        run: python scripts/pact/pact.py workflow-lint

      - name: Run deterministic PACT checks
        run: python scripts/pact/pact.py check

      - name: Test deterministic failure modes
        run: python -m unittest discover -s scripts/pact/tests -p 'test_*.py'

      - name: Run all three PACT-only synthetic evaluation cases
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/eight_stage_synthetic.py > /tmp/pact-eight-stage-synthetic.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/pact-eight-stage-synthetic.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["case_count"] == 3, report
          assert report["owner_time_minutes"] is None, report
          assert report["owner_clarification_count"] is None, report
          assert report["real_agent_compatibility_verified"] is False, report
          assert report["release_attestation"] is False, report
          for item in report["case_results"]:
              for mode in ("default", "work"):
                  scores = item[mode]
                  assert scores["oracle_count"] > 0, item
                  assert 0 <= scores["recall"] <= 1, item
                  print(
                      f"{item['id']}/{mode}: recall={scores['recall']:.3f} "
                      f"code_files={scores['code_file_count']} "
                      f"est_tokens={scores['selected_estimated_tokens']} "
                      f"elapsed_ms={scores['elapsed_ms']}"
                  )
          print("PACT synthetic assessment: NOT a real Agent or Owner outcome")
          PY

      - name: Frozen installed Decision-memory M0 A/B diagnostic
        shell: bash
        run: |
          set -euo pipefail
          run_exit=0
          python scripts/benchmark/decision_memory_m0.py > /tmp/pact-decision-memory-m0.json || run_exit=$?
          echo "M0 full synthetic A/B JSON, including any FAIL evidence:"
          cat /tmp/pact-decision-memory-m0.json
          test "$run_exit" -eq 0
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/pact-decision-memory-m0.json").read_text(encoding="utf-8"))
          assert report["case_count"] == 7
          assert report["oracle_target_count"] == 6
          assert report["installation"]["compact_archive_present"]
          assert report["real_agent_executed"] is False
          assert report["real_owner_data_observed"] is False
          assert report["independently_withheld_oracle"] is False
          for item in report["case_results"]:
              a = item["A"]["context"]
              b = item["B"]["context"]
              print(
                  f"{item['id']}: A_hits={a['matched_ids']} B_hits={b['matched_ids']} "
                  f"A_missing={a['missing_ids']} B_missing={b['missing_ids']} "
                  f"extra_est_tokens={item['delta_B_minus_A_est_tokens']} "
                  f"extra_ms={item['delta_B_minus_A_elapsed_ms']}"
              )
          print("M0 synthetic engineering gate:", report["synthetic_engineering_gate"])
          print("M0 observed gate failures:", json.dumps(report["gate_failures"]))
          print("PACT M0: diagnostic only, NOT a real Agent/Owner benefit experiment")
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/pact-decision-memory-m0.json").read_text(encoding="utf-8"))
          assert data["synthetic_engineering_gate"] == "PASS", data["gate_failures"]
          PY

      - name: Frozen installed Decision-memory M1 cold-start diagnostic (not an Agent trial)
        shell: bash
        run: |
          set -euo pipefail
          run_exit=0
          python scripts/benchmark/decision_memory_m1.py > /tmp/pact-decision-memory-m1.json || run_exit=$?
          echo "M1 complete case-level synthetic diagnostic JSON, including failures:"
          cat /tmp/pact-decision-memory-m1.json
          test "$run_exit" -eq 0
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/pact-decision-memory-m1.json").read_text(encoding="utf-8"))
          assert report["case_count"] == 8
          assert report["target_decision_count"] == 7
          assert report["knowledge_source_mutations"] == []
          assert report["synthetic_safety_gate"] == "PASS", report["gate_failures"]
          assert report["real_agent_executed"] is False
          assert report["independent_holdout"] is False
          assert report["agent_obedience_verified"] is False
          assert report["release_gate"] == "HOLD"
          for case in report["case_results"]:
              print(
                  f"{case['id']}: A_found={case['A_matched']} "
                  f"A_missed={case['A_missing']} "
                  f"metadata_only={case['B_path_current_hit']} "
                  f"extra_context_est_tokens=0"
              )
          print("M1 path suggestions never entered Context; NO real Agent/Owner claim")
          PY

      - name: Build derived project map
        run: |
          python scripts/pact/pact.py map --output /tmp/pact-project-map.json --ensure
          python scripts/pact/pact.py map --output /tmp/pact-project-map.json --ensure

      - name: Build generated code map
        run: |
          python scripts/pact/pact.py code-map --output /tmp/pact-code-map.json --ensure
          python scripts/pact/pact.py code-map --output /tmp/pact-code-map.json --ensure

      - name: Smoke-test Project Discovery
        run: python scripts/pact/pact.py discover "product truth" --index /tmp/pact-project-map.json --json

      - name: Smoke-test code-aware Project Discovery
        run: |
          python scripts/pact/pact.py discover "upgrade" \
            --index /tmp/pact-project-map.json \
            --code \
            --code-index /tmp/pact-code-map.json \
            --json

      - name: Smoke-test Project Explanation packet
        run: python scripts/pact/pact.py explain "product truth governance" --json

      - name: Smoke-test Context Resolver
        run: |
          python scripts/pact/pact.py context "product truth governance" \
            --success "Relevant project truth can be located" \
            --risk low \
            --output /tmp/pact-context.json

      - name: Smoke-test code-aware Context Resolver
        run: |
          python scripts/pact/pact.py context "upgrade distribution" \
            --success "Relevant runtime implementation can be located" \
            --risk medium \
            --code \
            --output /tmp/pact-code-context.json
          grep -q '"code_artifacts"' /tmp/pact-code-context.json

      - name: Smoke-test Impact Analysis
        run: python scripts/pact/pact.py impact --files AGENTS.md --json

      - name: Smoke-test code-aware Impact Analysis
        run: python scripts/pact/pact.py impact --files scripts/pact/upgrade.py --code --json

      - name: Validate convergence report contract
        run: python scripts/pact/pact.py converge .pact/examples/convergence-report.example.json

      - name: Validate evidence receipt contract
        run: python scripts/pact/pact.py evidence .pact/examples/evidence-receipt.example.json

      - name: Validate evidence-backed owner report
        run: |
          python scripts/pact/pact.py report .pact/examples/owner-report.example.json \
            --evidence .pact/examples/evidence-receipt.example.json \
            --convergence .pact/examples/convergence-report.example.json

      - name: Validate pilot evaluation contract
        run: |
          python scripts/pact/pact.py eval .pact/examples/pilot-evaluation.example.json
          python scripts/pact/pact.py eval .pact/examples/pilot-evaluation.example.json --summary --json

      - name: Build and smoke-test release assets
        run: python scripts/release/release_assets.py --output-dir /tmp/pact-release-assets --smoke

      - name: End-to-end brownfield scaffold
        run: |
          rm -rf /tmp/pact-adopted
          python scripts/pact/pact.py init --target /tmp/pact-adopted --apply --github-actions
          test -f /tmp/pact-adopted/.github/workflows/pact-project-check.yml
          python /tmp/pact-adopted/pact.py doctor --strict
          python /tmp/pact-adopted/pact.py fitness --strict --json
          python scripts/pact/pact.py version --target /tmp/pact-adopted --json
          python scripts/pact/pact.py upgrade --target /tmp/pact-adopted --json
          python /tmp/pact-adopted/pact.py owner --strict --json
          python /tmp/pact-adopted/pact.py readiness --json
          sed -i 's/"pending"/"reviewed"/g' /tmp/pact-adopted/.pact/baseline.toml
          python /tmp/pact-adopted/pact.py readiness --require-ready --json
          python /tmp/pact-adopted/pact.py audit
          python /tmp/pact-adopted/pact.py explain "product truth" --json
