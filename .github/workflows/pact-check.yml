name: PACT Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PACT checker dependencies
        run: python -m pip install -r scripts/pact/requirements.txt

      - name: PACT doctor
        run: python scripts/pact/pact.py doctor

      - name: PACT audit
        run: python scripts/pact/pact.py audit

      - name: Validate Owner Profile fallback
        run: python scripts/pact/pact.py owner --json

      - name: Run deterministic PACT checks
        run: python scripts/pact/pact.py check

      - name: Test deterministic failure modes
        run: python -m unittest discover -s scripts/pact/tests -p 'test_*.py'

      - name: Build derived project map
        run: python scripts/pact/pact.py map --output /tmp/pact-project-map.json

      - name: Smoke-test Project Discovery
        run: python scripts/pact/pact.py discover "product truth" --index /tmp/pact-project-map.json --json

      - name: Smoke-test Project Explanation packet
        run: python scripts/pact/pact.py explain "product truth governance" --json

      - name: Smoke-test Context Resolver
        run: |
          python scripts/pact/pact.py context "product truth governance" \
            --success "Relevant project truth can be located" \
            --risk low \
            --output /tmp/pact-context.json

      - name: Smoke-test Impact Analysis
        run: python scripts/pact/pact.py impact --files AGENTS.md --json

      - name: Validate convergence report contract
        run: python scripts/pact/pact.py converge .pact/examples/convergence-report.example.json

      - name: Validate evidence receipt contract
        run: python scripts/pact/pact.py evidence .pact/examples/evidence-receipt.example.json

      - name: Validate evidence-backed owner report
        run: |
          python scripts/pact/pact.py report .pact/examples/owner-report.example.json \
            --evidence .pact/examples/evidence-receipt.example.json \
            --convergence .pact/examples/convergence-report.example.json

      - name: End-to-end brownfield scaffold
        run: |
          rm -rf /tmp/pact-adopted
          python scripts/pact/pact.py init --target /tmp/pact-adopted --apply --github-actions
          test -f /tmp/pact-adopted/.github/workflows/pact-project-check.yml
          python /tmp/pact-adopted/scripts/pact/pact.py doctor --strict
          python scripts/pact/pact.py version --target /tmp/pact-adopted --json
          python scripts/pact/pact.py upgrade --target /tmp/pact-adopted --json
          python /tmp/pact-adopted/scripts/pact/pact.py owner --strict --json
          python /tmp/pact-adopted/scripts/pact/pact.py readiness --json
          sed -i 's/: pending/: reviewed/g' /tmp/pact-adopted/.pact/baseline.yaml
          python /tmp/pact-adopted/scripts/pact/pact.py readiness --require-ready --json
          python /tmp/pact-adopted/scripts/pact/pact.py audit
          python /tmp/pact-adopted/scripts/pact/pact.py explain "product truth" --json
