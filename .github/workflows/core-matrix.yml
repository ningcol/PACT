name: PACT Core Matrix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Runtime entry points
        run: |
          python pact.py --help
          python bootstrap.py --help
          python scripts/pact/pact.py schema-lint
          python scripts/pact/pact.py check

      - name: Cross-platform portability tests
        run: |
          python -m unittest discover -s scripts/pact/tests -p "test_bootstrap.py"
          python -m unittest discover -s scripts/pact/tests -p "test_compact_runtime.py"
          python -m unittest discover -s scripts/pact/tests -p "test_distribution_upgrade.py"
          python -m unittest discover -s scripts/pact/tests -p "test_stdlib_runtime.py"
          python -m unittest discover -s scripts/pact/tests -p "test_init_readiness.py"
          python -m unittest discover -s scripts/pact/tests -p "test_host_wiring.py"
          python -m unittest discover -s scripts/pact/tests -p "test_eight_stage_synthetic.py"
          python -m unittest discover -s scripts/pact/tests -p "test_synthetic_domain_host.py"
          python -m unittest discover -s scripts/pact/tests -p "test_discovery_ownership.py"
          python -m unittest discover -s scripts/pact/tests -p "test_cache_publishing_safety.py"
          python -m unittest discover -s scripts/pact/tests -p "test_multi_query_retrieval.py"
          python -m unittest discover -s scripts/pact/tests -p "test_context_intent_require_rules.py"
          python -m unittest discover -s scripts/pact/tests -p "test_installed_intent_comparison.py"
          python -m unittest discover -s scripts/pact/tests -p "test_mixed_authority.py"
          python -m unittest discover -s scripts/pact/tests -p "test_audit_retention.py"
          python -m unittest discover -s scripts/pact/tests -p "test_decision_supersession_links.py"
          python -m unittest discover -s scripts/pact/tests -p "test_impact_markdown_links.py"
          python -m unittest discover -s scripts/pact/tests -p "test_task_change_coverage.py"
          python -m unittest discover -s scripts/pact/tests -p "test_convergence_deletion_semantics.py"
          python -m unittest discover -s scripts/pact/tests -p "test_task_state_atomicity.py"
          python -m unittest discover -s scripts/pact/tests -p "test_task_state_root_safety.py"
          python -m unittest discover -s scripts/pact/tests -p "test_task_workflow.py"
          python -m unittest discover -s scripts/pact/tests -p "test_task_handoff.py"
          python -m unittest discover -s scripts/pact/tests -p "test_run_input_origins.py"
          python -m unittest discover -s scripts/pact/tests -p "test_merged_trust_integration.py"
          python -m unittest discover -s scripts/pact/tests -p "test_run_pipe_shutdown.py"
          python -m unittest discover -s scripts/pact/tests -p "test_streaming_reliability.py"
          python -m unittest discover -s scripts/pact/tests -p "test_workspace_git_identity.py"
