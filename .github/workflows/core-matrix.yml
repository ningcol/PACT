name: PACT Core Matrix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Runtime entry points
        shell: bash
        run: |
          set -euo pipefail
          python pact.py --help
          python bootstrap.py --help
          python scripts/pact/pact.py schema-lint
          python scripts/pact/pact.py check

      - name: Cross-platform portability tests
        shell: bash
        run: |
          set -euo pipefail
          # Auto-discover every current and future test, including trusted
          # Evidence / Task Finish, on all three OS and Python versions.
          python -m unittest discover -s scripts/pact/tests -p 'test_*.py'
