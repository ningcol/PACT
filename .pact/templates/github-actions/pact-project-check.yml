name: PACT Project Check

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  pact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate PACT foundation
        run: python scripts/pact/pact.py doctor --strict

      - name: Run deterministic PACT checks
        run: python scripts/pact/pact.py check

      - name: Run architecture fitness functions
        run: python scripts/pact/pact.py fitness --strict

      - name: Report PACT readiness
        run: python scripts/pact/pact.py readiness

      - name: Audit explicit PACT state
        run: python scripts/pact/pact.py audit

      # Project-owned build/test/E2E/visual verification should remain in the
      # project's existing CI. PACT does not guess those commands.
