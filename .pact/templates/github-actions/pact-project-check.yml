name: PACT Project Check

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  pact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate PACT foundation
        run: python pact.py doctor --strict

      - name: Run deterministic PACT checks
        run: python pact.py check

      - name: Run architecture fitness functions
        run: python pact.py fitness --strict

      - name: Report PACT readiness
        run: python pact.py readiness

      - name: Audit explicit PACT state
        run: python pact.py audit

      # Project-owned build/test/E2E/visual verification should remain in the
      # project's existing CI. PACT does not guess those commands.
